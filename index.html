<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuantos dias quedan para el cole</title>
<link rel="icon" type="image/png" href="logo.png">

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#0f1724;
    color:#f1f5f9;
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.card{
    background:#1e293b;
    padding:30px;
    border-radius:12px;
    max-width:700px;
    width:100%;
    box-shadow:0 8px 20px rgba(0,0,0,.5);
    text-align:center;
}

h1{
    margin-top:0;
}

.stats{
    margin-top:25px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.stat{
    background:#0f172a;
    padding:15px;
    border-radius:8px;
}

.big{
    font-size:2rem;
    font-weight:bold;
}

.progress{
    margin-top:25px;
    height:18px;
    background:#334155;
    border-radius:999px;
    overflow:hidden;
}

.bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#f59e0b,#ef4444);
    transition:.5s;
}

.small{
    margin-top:10px;
    color:#94a3b8;
}

.boton-juegos{
    display:inline-block;
    margin-top:25px;
    padding:12px 24px;
    background:#4CAF50;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-size:18px;
}

.boton-juegos:hover{
    background:#45a049;
}
</style>
</head>
<body>

<div class="card">

    <h1>Contador de dias de verano</h1>

    <p>
        Del <strong>20/06/2026</strong> al
        <strong>06/09/2026</strong>
    </p>

    <div class="stats">

        <div class="stat">
            <div>Días totales de verano</div>
            <div id="totalDays" class="big">—</div>
        </div>

        <div class="stat">
            <div>Días transcurridos</div>
            <div id="elapsedDays" class="big">—</div>
        </div>

        <div class="stat">
            <div>Días para volver al cole</div>
            <div id="remainingDays" class="big">—</div>
        </div>

        <div class="stat">
            <div>Porcentaje transcurrido</div>
            <div id="percentText" class="big">—%</div>
        </div>

    </div>

    <div class="progress">
        <div id="bar" class="bar"></div>
    </div>

    <div class="small">
        Hoy es <span id="todayDate">—</span>
    </div>

    <a href="https://chonni777.github.io/eufrasiojuegos/" class="boton-juegos">
        Juegos
    </a>

</div>

<script>

function parseDate(str){
    const [y,m,d]=str.split('-').map(Number);
    return new Date(y,m-1,d);
}

function formatDate(date){
    return date.toLocaleDateString("es-ES");
}

const start = parseDate("2026-06-20");
const end = parseDate("2026-09-06");

function compute(){

    const today = new Date();
    today.setHours(0,0,0,0);

    const total =
        Math.floor((end-start)/(1000*60*60*24))+1;

    let elapsed = 0;

    if(today >= start){
        elapsed =
            Math.min(
                total,
                Math.floor((today-start)/(1000*60*60*24))+1
            );
    }

    const remaining = Math.max(0,total-elapsed);

    const pct =
        Math.round((elapsed/total)*1000)/10;

    document.getElementById("totalDays").textContent = total;
    document.getElementById("elapsedDays").textContent = elapsed;
    document.getElementById("remainingDays").textContent = remaining;
    document.getElementById("percentText").textContent = pct + "%";
    document.getElementById("bar").style.width = pct + "%";
    document.getElementById("todayDate").textContent = formatDate(today);
}

compute();

function scheduleUpdate(){
    const now = new Date();
    const next = new Date(now);
    next.setHours(24,0,0,0);

    setTimeout(()=>{
        compute();
        scheduleUpdate();
    }, next-now+100);
}

scheduleUpdate();

</script>

</body>
</html>
